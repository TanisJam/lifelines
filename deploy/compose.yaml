# Homelab deploy: one long-running lifelines container behind Traefik, on the shared `coolify`
# Docker network. Run from the repo root: `docker compose -f deploy/compose.yaml up -d --build`.
# Requires an `.env` file next to this one (copy `deploy/env.example`) and the external `coolify`
# network to already exist.
services:
  lifelines:
    image: lifelines:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Measured, not guessed (odd/tasks/lifecycle-full-lifetime.md L8): a full life - the protagonist's
      # whole 57-year life at seed cap-0 - completes at 1536 MB of JS heap with a 1.36 GiB VmHWM peak.
      # Without an explicit cap V8 sizes the heap from the HOST instead of this cgroup limit, so it
      # never collects, reaches ~4.6 GB and dies.
      NODE_OPTIONS: --max-old-space-size=1536
    # Bounds the container's total memory (the app's own STORE_CACHE_SIZE bounds the two in-process
    # life/world LRU caches, but this is the outer guardrail against the whole container's usage —
    # Node's own overhead, request buffering, etc.).
    # MEASURED, not assumed: with the 1536 MB heap cap above, a full create peaks at 1.36 GiB RSS
    # (VmHWM), so 2560m leaves ~1.2 GiB of headroom. A lower bound looks affordable now, but this
    # value was validated in the real container against the OLD 2.07 GiB peak, not re-measured since -
    # re-measure inside the container before lowering it or the heap cap.
    mem_limit: 2560m
    volumes:
      - lifelines-data:/data
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.lifelines.entrypoints=http"
      - "traefik.http.routers.lifelines.rule=Host(`lifelines.mnr.ar`)"
      - "traefik.http.services.lifelines.loadbalancer.server.port=3000"

volumes:
  lifelines-data:

networks:
  coolify:
    external: true
